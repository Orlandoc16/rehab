<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 'poppins': ['Poppins', 'sans-serif'] },
                    colors: {
                        primary: '#6366f1',
                        secondary: '#8b5cf6',
                        accent: '#f43f5e',
                        success: '#10b981',
                        warning: '#f59e0b',
                    }
                }
            }
        }
    </script>

    <style>
        .recording {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.05);
                opacity: 0.8;
            }
        }

        .score-circle {
            transition: stroke-dashoffset 0.5s ease-in-out;
        }

        .word-card {
            transition: all 0.3s ease;
        }

        .word-card:hover {
            transform: translateY(-4px);
        }

        .feedback-excellent {
            background: linear-gradient(135deg, #10b981, #059669);
        }

        .feedback-good {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
        }

        .feedback-fair {
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }

        .feedback-retry {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }
    </style>
<style id="a11y">:focus-visible{outline:3px solid #1a73e8;outline-offset:2px}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}</style>
</head>

<body class="font-poppins bg-gradient-to-br from-indigo-50 via-white to-purple-50 min-h-screen">

                    <div class="w-8 h-8 rounded-lg bg-indigo-100 flex items-center justify-center mr-3 text-indigo-600">

    <main class="container mx-auto px-4 py-6 pt-24 md:pt-28">
        <!-- Category & Level Selector -->

            <select id="category-select"
                class="bg-white border-2 border-gray-200 rounded-xl px-4 py-3 font-medium focus:border-primary focus:outline-none">

            <select id="level-select"
                class="bg-white border-2 border-gray-200 rounded-xl px-4 py-3 font-medium focus:border-primary focus:outline-none">

                <option value="2">Nivel 2 - Palabras +</option>
                <option value="3">Nivel 3 - Frases cortas</option>
                <option value="4">Nivel 4 - Frases</option>
                <option value="5">Nivel 5 - Frases largas</option>

            <select id="speed-select" class="bg-white border-2 border-gray-200 rounded-xl px-4 py-3 font-medium focus:border-primary focus:outline-none">
                <option value="lenta" selected>🐢 Voz lenta (recomendado)</option>
                <option value="normal">Voz normal</option>
            </select>
            <div id="sugerencia-nivel" class="hidden col-span-full bg-indigo-50 border border-indigo-200 text-indigo-800 rounded-xl px-4 py-2 font-medium" role="status"></div>

            <button aria-label="Cargar palabras para practicar" onclick="loadWords()"
                class="bg-primary text-white px-6 py-3 rounded-xl font-medium hover:bg-primary/90 transition">
                <i class="fas fa-sync-alt mr-2"></i>Cargar
            </button>
        </div>

        <!-- Main Practice Area -->
        <div class="grid lg:grid-cols-3 gap-6">
            <!-- Word List -->
            <div class="lg:col-span-1 bg-white rounded-2xl shadow-lg p-6 max-h-[600px] overflow-y-auto">
                <h3 class="text-lg font-bold text-gray-800 mb-4">
                    <i class="fas fa-list mr-2 text-primary"></i>Palabras
                </h3>
                <div id="word-list" class="space-y-2">
                    <!-- Se llena dinámicamente -->
                </div>
            </div>

            <!-- Practice Panel -->
            <div class="lg:col-span-2">
                <!-- Current Word Display -->
                <div class="bg-white rounded-2xl shadow-lg p-8 mb-6 text-center">
                    <p class="text-gray-500 mb-2">Palabra a practicar:</p>
                    <h2 id="current-word" class="text-4xl md:text-5xl font-bold text-gray-800 mb-4">
                        Selecciona una palabra

                    <!-- Listen Button -->

                        <i class="fas fa-volume-up mr-2"></i>Escuchar pronunciación
                    </button>

                    <!-- Record Button -->
                    <div class="flex justify-center">
                        <button onclick="toggleRecording()" id="record-btn" aria-label="Grabar pronunciación"
                            class="w-32 h-32 rounded-full bg-gradient-to-br from-accent to-red-600 text-white shadow-xl hover:shadow-2xl transition-all flex items-center justify-center"
                            disabled>
                            <i class="fas fa-microphone text-4xl" id="record-icon"></i>
                        </button>
                    </div>
                    <p id="record-status" class="mt-4 text-gray-500">Selecciona una palabra para comenzar</p>
                </div>

                <!-- Feedback Panel -->
                <div id="feedback-panel" class="hidden bg-white rounded-2xl shadow-lg p-6">
                    <div class="flex items-start gap-6">
                        <!-- Score Circle -->
                        <div class="flex-shrink-0">
                            <svg class="w-24 h-24" viewBox="0 0 100 100">
                                <circle cx="50" cy="50" r="45" fill="none" stroke="#e5e7eb" stroke-width="8" />
                                <circle id="score-circle" cx="50" cy="50" r="45" fill="none" stroke="#10b981"
                                    stroke-width="8" stroke-dasharray="283" stroke-dashoffset="283"
                                    stroke-linecap="round" transform="rotate(-90 50 50)" class="score-circle" />
                                <text x="50" y="55" text-anchor="middle" id="score-text"
                                    class="text-2xl font-bold fill-gray-800">0%</text>
                            </svg>
                        </div>

                        <!-- Feedback Content -->
                        <div class="flex-1">
                            <h4 id="feedback-message" class="text-xl font-bold text-gray-800 mb-2"></h4>
                            <p id="feedback-transcription" class="text-gray-600 mb-3"></p>
                            <p id="feedback-encouragement" class="text-gray-500 mb-4"></p>

                            <!-- Tips -->
                            <div id="feedback-tips" class="bg-gray-50 rounded-xl p-4">
                                <h5 class="font-semibold text-gray-700 mb-2">
                                    <i class="fas fa-lightbulb text-yellow-500 mr-2"></i>Consejos:
                                </h5>
                                <ul id="tips-list" class="text-sm text-gray-600 space-y-1"></ul>
                            </div>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex justify-center gap-4 mt-6">
                        <button aria-label="Repetir la palabra" onclick="repeatWord()"
                            class="bg-orange-100 text-orange-600 px-6 py-3 rounded-xl font-medium hover:bg-orange-200 transition">
                            <i class="fas fa-redo mr-2"></i>Repetir
                        </button>
                        <button onclick="nextWord()"
                            class="bg-primary text-white px-6 py-3 rounded-xl font-medium hover:bg-primary/90 transition">
                            Siguiente<i class="fas fa-arrow-right ml-2"></i>
                        </button>
                    </div>
                </div>

                <!-- Session Stats -->
                <div class="grid grid-cols-3 gap-4 mt-6">
                    <div class="bg-white rounded-xl p-4 text-center shadow">
                        <div class="text-2xl font-bold text-primary" id="session-attempts">0</div>
                        <p class="text-gray-500 text-sm">Intentos</p>
                    </div>
                    <div class="bg-white rounded-xl p-4 text-center shadow">
                        <div class="text-2xl font-bold text-success" id="session-correct">0</div>
                        <p class="text-gray-500 text-sm">Correctos</p>
                    </div>
                    <div class="bg-white rounded-xl p-4 text-center shadow">
                        <div class="text-2xl font-bold text-warning" id="session-avg">0%</div>
                        <p class="text-gray-500 text-sm">Promedio</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Audio Player (hidden) -->
    <audio id="audio-player" class="hidden"></audio>

    <script>
        // State
        let currentWord = null;
        let words = [];
        let wordIndex = 0;
        let isRecording = false;
        let mediaRecorder = null;
        let audioChunks = [];
        let sessionStats = { attempts: 0, correct: 0, totalScore: 0 };
        let recordingTimeout = null;
        const MAX_RECORDING_TIME = 8000; // 8 segundos máximo
        let currentLevel = 1;
        let intentosRecientes = [];

        // Hybrid Recognition
        let recognition = null;
        let recognitionFinalized = false;

        // Setup Web Speech API
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'es-ES';
            recognition.maxAlternatives = 1;

            recognition.onresult = function (event) {
                if (event.results.length > 0) {
                    const result = event.results[0][0];
                    const transcript = result.transcript;
                    const confidence = result.confidence;

                    console.log(`🗣️ Browser heard: "${transcript}" (Confidence: ${confidence})`);

                    if (currentWord && isRecording && !recognitionFinalized) {
                        recognitionFinalized = true;
                        checkHybridMatch(transcript, confidence);
                    }
                }
            };

            recognition.onerror = function (event) {
                console.error('Speech recognition error:', event.error);
                // Si falla el reconocimiento local, confiamos en el servidor (audio)
            };

            recognition.onend = function () {
                // Si el reconocimiento termina por "silencio" y seguimos grabando, 
                // detener la grabación también (Auto-Stop VAD)
                if (isRecording) {
                    console.log("🛑 Recognition ended (Silence detected)");
                    stopRecording();
                }
            };
        } else {
            console.warn("Web Speech API not supported in this browser");
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            await loadCategories();

            // Check URL params
            const params = new URLSearchParams(window.location.search);
            const category = params.get('category');
            if (category) {
                document.getElementById('category-select').value = category;
                await loadWords();
            }
        });

        // Función rápida para normalizar texto (similar al backend)
        function normalizeText(text) {
            return text.toLowerCase()
                .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // quitar tildes
                .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "")
                .trim();
        }

        async function levenshtein(a, b) {
            const m = a.length, n = b.length;
            if (!m) return n; if (!n) return m;
            let prev = Array.from({ length: n + 1 }, (_, i) => i);
            for (let i = 1; i <= m; i++) {
                const cur = [i];
                for (let j = 1; j <= n; j++) {
                    cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
                }
                prev = cur;
            }
            return prev[n];
        }
        function similitud(a, b) {
            const d = levenshtein(a, b);
            return 1 - d / Math.max(a.length, b.length);
        }
        function checkHybridMatch(transcript, confidence) {
            const target = normalizeText(currentWord.word);
            const heard = normalizeText(transcript);

            // Si hay alta confianza y coincidencia exacta
            const sim = similitud(target, heard);
            if (confidence > 0.85 && (sim >= 0.75 || (confidence >= 0.9 && sim >= 0.6))) {
                const score = Math.min(99, Math.round(sim * 100));
                console.log("✨ ACEPTADO EN CLIENTE (similitud " + Math.round(sim * 100) + "%)!");
                recognitionFinalized = true;

                // UX Inmediata
                showFeedback({
                    success: true,
                    is_correct: true,
                    score: 100,
                    transcription: transcript,
                    feedback: {
                        message: score >= 95 ? "¡Excelente! 🎉" : "¡Muy bien! 👏",
                        encouragement: "Verificación instantánea.",
                        tips: []
                    },
                    scores: { final: score }
                });
                updateSessionStats({ is_correct: score >= 75, scores: { final: score } });

                // Detener grabación para procesar el audio y enviarlo en background
                stopRecording();
            } else {
                console.log("🤔 Enviando al servidor para verificación precisa (puede tardar 20-40 s)…");
                // Dejar que el flujo normal envíe el audio al parar
            }
        }

        async function loadCategories() {
            try {
                const res = await fetch('/api/categories');
                const data = await res.json();

                const select = document.getElementById('category-select');
                data.categories.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat.id;
                    option.textContent = `${cat.icon} ${cat.name}`;
                    select.appendChild(option);
                });
            } catch (e) {
                if (e.name === 'AbortError') {
                    const targetN = normalizeText(currentWord ? currentWord.word : '');
                    const heardN = window.lastBrowserTranscript ? normalizeText(window.lastBrowserTranscript) : '';
                    const sim = heardN ? similitud(targetN, heardN) : 0;
                    const score = Math.round(sim * 100);
                    showFeedback({ success: sim >= 0.6, is_correct: sim >= 0.6, score,
                        transcription: window.lastBrowserTranscript || '(audio guardado)',
                        feedback: { message: sim >= 0.6 ? '✓ Aceptado con el resultado del navegador (el servidor tardó demasiado)' : 'El servidor tardó demasiado y no se detectó la palabra',
                                    encouragement: 'Tu audio quedó guardado. Intenta de nuevo.', tips: [] },
                        scores: { final: score } });
                    updateSessionStats({ is_correct: sim >= 0.6, scores: { final: score } });
                    return;
                }
                console.error('Error:', e);
            }
        }

        async function loadWords() {
            const category = document.getElementById('category-select').value;
            const level = document.getElementById('level-select').value;
            currentLevel = parseInt(level);

            if (!category) {
                alert('Selecciona una categoría');
                return;
            }

            try {
                // Mostrar estado de carga
                document.getElementById('word-list').innerHTML = '<div class="p-4 text-center"><i class="fas fa-spinner fa-spin text-primary"></i> Cargando...</div>';

                const res = await fetch(`/api/words/${category}?level=${level}`);
                const data = await res.json();
                words = data.words;
                wordIndex = 0;

                renderWordList();

                if (words.length > 0) {
                    selectWord(0);
                    // Pre-cargar audio de la primera palabra
                    preloadAudio(words[0].word);
                } else {
                    document.getElementById('word-list').innerHTML =
                        '<p class="text-gray-500 text-center py-4">No hay palabras en este nivel.</p>';
                }
            } catch (e) {
                console.error('Error:', e);
                alert('Error al cargar palabras.');
            }
        }

        function preloadAudio(word) {
            const audio = new Audio();
            audio.src = `/api/speak/${encodeURIComponent(word)}?speed=${encodeURIComponent(document.getElementById('speed-select')?.value || 'normal')}`;
            audio.preload = 'auto';
        }

        function renderWordList() {
            const container = document.getElementById('word-list');
            container.innerHTML = words.map((word, idx) => `
                <div onclick="selectWord(${idx})" 
                     class="word-card p-3 rounded-xl cursor-pointer border-2 border-transparent hover:border-primary/50 ${idx === wordIndex ? 'bg-primary/10 border-primary' : 'bg-gray-50'}"
                     id="word-item-${idx}">
                    <span class="font-medium text-gray-800">${word.word}</span>
                    <span class="text-xs text-gray-600 ml-2">Nivel ${word.level}</span>
                </div>
            `).join('');
        }

        function selectWord(idx) {
            wordIndex = idx;
            currentWord = words[idx];

            document.getElementById('current-word').textContent = currentWord.word;
            document.getElementById('phonetic-hint').textContent = currentWord.phonetic_hint || '';
            document.getElementById('record-status').textContent = 'Presiona el botón para grabar';
            anunciar('Presiona el botón para grabar');
            document.getElementById('record-btn').disabled = false;
            document.getElementById('listen-btn').disabled = false;
            document.getElementById('feedback-panel').classList.add('hidden');

            renderWordList();

            // Pre-cargar siguiente audio
            if (idx + 1 < words.length) {
                preloadAudio(words[idx + 1].word);
            }
        }

        async function playTargetWord() {
            if (!currentWord) return;
            try {
                const audio = document.getElementById('audio-player');
                audio.src = `/api/speak/${encodeURIComponent(currentWord.word)}?t=${new Date().getTime()}&speed=${encodeURIComponent(document.getElementById('speed-select')?.value || 'normal')}`;
                await audio.play();
            } catch (e) {
                console.error('Error playing:', e);
            }
        }

        async function toggleRecording() {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                recognitionFinalized = false;

                // Start Web Speech API (VAD & Hybrid)
                if (recognition) {
                    try {
                        recognition.start();
                    } catch (e) {
                        console.warn("Recognition already started", e);
                    }
                }

                // Timeout por seguridad (si VAD falla)
                recordingTimeout = setTimeout(() => {
                    if (isRecording) {
                        console.log('⏱️ Max time reached');
                        stopRecording();
                    }
                }, MAX_RECORDING_TIME);

                mediaRecorder.ondataavailable = (e) => {
                    audioChunks.push(e.data);
                };

                mediaRecorder.onstop = async () => {
                    if (recordingTimeout) {
                        clearTimeout(recordingTimeout);
                        recordingTimeout = null;
                    }

                    // Si ya finalizamos con éxito (hybrid match), enviamos como background data
                    if (recognitionFinalized) {
                        console.log("📤 Sending background log...");
                        sendAudioToServer(true);
                    } else {
                        // Flujo normal: enviar para análisis y esperar respuesta UI
                        sendAudioToServer(false);
                    }

                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                isRecording = true;

                document.getElementById('record-btn').classList.add('recording');
                document.getElementById('record-icon').className = 'fas fa-stop text-4xl';
                document.getElementById('record-status').textContent = 'Escuchando... (se detendrá al callar)';
            anunciar('Escuchando... (se detendrá al callar)');

            } catch (e) {
                console.error('Error config mic:', e);
                alert('Error acceso micrófono: ' + e.message);
            }
        }

        function stopRecording() {
            if (isRecording) {
                isRecording = false; // Flag first

                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    mediaRecorder.stop();
                }
                if (recognition) {
                    try { recognition.stop(); } catch (e) { }
                }

                document.getElementById('record-btn').classList.remove('recording');
                document.getElementById('record-icon').className = 'fas fa-microphone text-4xl';
                document.getElementById('record-status').textContent = 'Procesando...';
            anunciar('Procesando...');
            }
        }

        async function sendAudioToServer(isBackgroundData = false) {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });

        // Timeout de seguridad: si el servidor tarda demasiado, resolvemos con lo que oyó el navegador
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 75000);

            if (!isBackgroundData) {
                document.getElementById('record-status').textContent = '☁️ Verificación precisa (20-40 s)...';
            anunciar('☁️ Consultando experto...');
            }

            const formData = new FormData();
            formData.append('audio_file', audioBlob, 'recording.webm');
            formData.append('target_word', currentWord.word);
            formData.append('level', currentLevel.toString());

            try {
                const res = await fetch('/api/analyze-voice', {
                    method: 'POST',
                    body: formData
                });

                if (!res.ok) throw new Error(res.statusText);

                const result = await res.json();

                if (!isBackgroundData) {
                    showFeedback(result);
                    updateSessionStats(result);
                } else {
                    console.log("✅ Background Audio Saved");
                }

            } catch (e) {
                console.error('Server analysis failed:', e);
                if (!isBackgroundData) {
                    document.getElementById('record-status').textContent = '❌ Error de conexión';
            anunciar('❌ Error de conexión');
                }
            }
        }

        function showFeedback(result) {
            const panel = document.getElementById('feedback-panel');
            panel.classList.remove('hidden');

            const score = result.scores ? Math.round(result.scores.final) : 0;

            // Dificultad adaptativa (estilo Constant Therapy): media de los últimos 5 intentos
            intentosRecientes.push(score);
            if (intentosRecientes.length > 5) intentosRecientes.shift();
            const sug = document.getElementById('sugerencia-nivel');
            if (sug && intentosRecientes.length >= 3) {
                const media = intentosRecientes.reduce((a, b) => a + b, 0) / intentosRecientes.length;
                let msg = '';
                if (media >= 80 && currentLevel < 5) msg = '\u00a1Vas genial! Considera subir al nivel ' + (currentLevel + 1);
                else if (media < 40 && currentLevel > 1) msg = 'Considera bajar al nivel ' + (currentLevel - 1) + ' para ganar confianza';
                if (msg) { sug.textContent = '\uD83D\uDCA1 ' + msg; sug.classList.remove('hidden'); anunciar(msg); }
                else sug.classList.add('hidden');
            }

            const circle = document.getElementById('score-circle');
            const offset = 283 - (283 * score / 100);
            circle.style.strokeDashoffset = offset;
            circle.style.stroke = score >= 70 ? '#10b981' : score >= 50 ? '#f59e0b' : '#ef4444';
            document.getElementById('score-text').textContent = score + '%';

            document.getElementById('feedback-message').textContent = result.feedback.message;
            document.getElementById('feedback-transcription').textContent =
                `"${result.transcription}"`;
            anunciar('Resultado: ' + result.feedback.message + ' Dijiste: ' + result.transcription);
            document.getElementById('feedback-encouragement').textContent = result.feedback.encouragement;

            const tipsList = document.getElementById('tips-list');
            if (result.feedback.tips) {
                tipsList.innerHTML = result.feedback.tips.map(tip =>
                    `<li><i class="fas fa-check text-green-500 mr-2"></i>${tip}</li>`
                ).join('');
            } else {
                tipsList.innerHTML = '';
            }

            document.getElementById('record-status').textContent =
                result.is_correct ? '✅ ¡Correcto!' : 'Intenta de nuevo';
        }

        function updateSessionStats(result) {
            sessionStats.attempts++;
            if (result.scores) {
                sessionStats.totalScore += result.scores.final;
            }

            if (result.is_correct) {
                sessionStats.correct++;
            }

            document.getElementById('session-attempts').textContent = sessionStats.attempts;
            document.getElementById('session-correct').textContent = sessionStats.correct;
            document.getElementById('session-avg').textContent =
                Math.round(sessionStats.totalScore / sessionStats.attempts) + '%';

            const currentPoints = parseInt(document.getElementById('session-points').textContent);
            const added = result.is_correct ? 10 : 2;
            const newPoints = currentPoints + added;

            document.getElementById('session-points').textContent = newPoints;

            // Animation for points
            const ptEl = document.getElementById('session-points');
            ptEl.classList.add('scale-125');
            setTimeout(() => ptEl.classList.remove('scale-125'), 200);
        }

        function repeatWord() {
            document.getElementById('feedback-panel').classList.add('hidden');
            document.getElementById('record-status').textContent = 'Presiona el botón para grabar';
            anunciar('Presiona el botón para grabar');
        }

        function nextWord() {
            if (wordIndex < words.length - 1) {
                selectWord(wordIndex + 1);
            } else {
                alert('¡Has completado todas las palabras! 🎉');
            }
        }
    </script>
<div aria-live="polite" aria-atomic="true" class="visually-hidden" id="anunciador"></div><script>window.anunciar = t => { const el = document.getElementById('anunciador'); if (el) el.textContent = t; };</script>
</body>
